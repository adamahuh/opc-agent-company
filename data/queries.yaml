# v0 2026-11-19 · read-only source of truth: docs/QUERIES.md explains the rules behind these
# subject S1 is SYNTHETIC (modelled on observed SG beadwork practitioners) - see CANDIDATES.md
meta:
  date: 2026-11-19
  language_of_record: en
  surfaces: [google_web, google_ai_overviews, chatgpt, gemini, perplexity, bing, duckduckgo, youtube, instagram, tiktok]
  naver_mode: manual_only_no_crawling   # search.naver.com/robots.txt disallows all
  grading: [ABSENT, MEDIATED, THIN, OWNED]
subjects:
